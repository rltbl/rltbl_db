name: Test

on:
  push:
    branches:
      - '*'
env:
  CARGO_TERM_COLOR: always
jobs:
  run-tests:
    runs-on: ubuntu-22.04
    steps:
      - name: Install postgresql server and client
        run: |
          sudo apt-get update
          sudo apt-get install postgresql postgresql-contrib postgresql-client build-essential csvtool libsqlite3-ext-csv
      - name: Start the database server
        run: |
          sudo systemctl start postgresql.service
      - name: Create the rltbl_db database
        run: |
          sudo su - postgres -c "createuser runner"
          sudo su - postgres -c "createdb -O runner rltbl_db"
          sudo cp /usr/lib/x86_64-linux-gnu/sqlite/csv.so .
      - name: Check out repository code
        uses: actions/checkout@v3
      - name: Run tests
        run: |
          make test
