[package]
name = "rltbl_db"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "rltbl_db is the database layer for the Relatable project."
repository = "https://github.com/rltbl/rltbl_db"
categories = ["database"]
readme = "README.md"

[dependencies]
async-trait = "0.1.89"
bytes = "1.11"
csv = "1.4.0"
deadpool-postgres = { version = "0.14.1", features = ["rt_tokio_1", "serde"], optional = true }
deadpool-sqlite = { version = "0.12.1", features = ["bundled", "csvtab", "vtab", "functions"], optional = true }
deadpool-libsql = { version = "0.1.0", optional = true }
futures-util = "0.3.33"
indexmap = { version = "2.12.0", features = ["serde"] }
lazy_static = "1.5.0"
rand = "0.9.2"
regex = "1.12.2"
rust_decimal = { version = "1.42.1", features = ["db-tokio-postgres", "macros"], optional = true }
serde = { version = "1.0.226", features = ["derive"] }
serde_json = { version = "1.0.145", features = ["preserve_order"] }

# TODO: tokio was moved here from the dev-dependencies because it is needed to run the performance
# test. Might it be possible to move it back somehow? Similarly for the other dependencies below.
# It would be good if they could be added only to dev-dependencies:
tokio = { version = "1.52.3", features = ["full"] }
anyhow = "1.0.100"
slurp = "1.0.1"
clap = "4.6.1"
rlt = "0.5.0"

tokio-postgres = { version = "0.7", features = ["with-serde_json-1"], optional = true }
tree-sitter = "0.26.3"
tree-sitter-sequel = "0.3.11"

[dev-dependencies]
axum = "0.8.4"
pretty_assertions = "1.4.1"
serde_unit_struct = "0.1.4"
tower-service = "0.3.3"

[features]
default = ["rusqlite", "tokio-postgres"]
rusqlite = ["dep:deadpool-sqlite", "rust_decimal/macros"]
tokio-postgres = ["dep:deadpool-postgres", "dep:tokio-postgres", "rust_decimal/macros"]
libsql = ["dep:deadpool-libsql", "rust_decimal/macros"]

[[bin]]
name = "rltbl_db_perf"
path = "src/rltbl_db_perf.rs"